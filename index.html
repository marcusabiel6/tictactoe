<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>tic tac toe</title>
  <style>
    body { font-family:sans-serif; text-align:center; margin-top:50px; }
    #board { display:grid; grid-template-columns: repeat(3, 100px); grid-gap:5px; justify-content:center; }
    .cell { width:100px; height:100px; border:1px solid #333; font-size:64px; cursor:pointer; display:flex; align-items:center; justify-content:center; }
    #status { margin-top:20px; font-size:20px; }
    button { margin-top:10px; padding:5px 10px; }
  </style>
</head>
<body>
  <h1>tic tac toe (multiplayer soon!!)</h1>
  <div id="board"></div>
  <div id="status">player O's turn</div>
  <button onclick="resetGame()">retry</button>

  <script>
    let board = Array(9).fill('');
    let currentPlayer = 'O';
    const boardDiv = document.getElementById('board');
    const statusDiv = document.getElementById('status');

    function createBoard() {
      boardDiv.innerHTML = '';
      for(let i=0;i<9;i++){
        const cell = document.createElement('div');
        cell.className='cell';
        cell.dataset.index=i;
        cell.addEventListener('click', () => makeMove(i));
        cell.textContent = board[i];
        boardDiv.appendChild(cell);
      }
    }

    function makeMove(i){
      if(board[i]!==''||checkWinner()) return;
      board[i]=currentPlayer;
      createBoard();
      if(checkWinner()){
        statusDiv.textContent = ` ${currentPlayer} won. press retry button to well... retry.`;
      } else if(board.every(c=>c!==''))
        statusDiv.textContent = "draw. press retry button to well.. retry.";
      else{
        currentPlayer = currentPlayer==='X'?'O':'X';
        statusDiv.textContent = `Player ${currentPlayer}'s turn.`;
      }
    }

    function checkWinner(){
      const combos=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
      return combos.some(c=>board[c[0]]!=='' && board[c[0]]===board[c[1]] && board[c[1]]===board[c[2]]);
    }

    function resetGame(){
      board = Array(9).fill('');
      currentPlayer='X';
      statusDiv.textContent = `Player ${currentPlayer}'s turn`;
      createBoard();
    }

    createBoard();
    <!-- how to play section -->
<div id="howtoplay">
  <h2>how to play</h2>
  <p>here are the basic instructions for this game:</p>
  <ul>
    <li>each player takes turns making moves.</li>
    <li>click at the board to make your moves.</li>
    <li>if you make a straight or diagonal line with your symbol, you win.</li>
    <li>the game ends automatically when no more moves are available or the win condition is met.</li>
    <li>strategy, planning ahead and using your opponents moves as an opportunoty to win is how you win.</li>
  </ul>
</div>

<!-- optional CSS to style it nicely -->
<style>
  #howtoplay {
    max-width: 500px;
    margin-top: 50px;
    padding: 20px;
    border: 2px solid #333;
    border-radius: 10px;
    background-color: #f0f0f0;
  }
  #howtoplay h2 {
    margin-top: 0;
    font-size: 1.5em;
  }
  #howtoplay ul {
    padding-left: 20px;
  }
</style>

  </script>
</body>
</html>
